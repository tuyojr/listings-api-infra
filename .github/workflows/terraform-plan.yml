name: Terraform Plan

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number to post the plan comment to. Omit for a push-triggered or standalone run."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to post the plan comment to (optional)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.0"

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        environment: [dev]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ matrix.environment }}-${{ github.run_id }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ secrets.TF_STATE_KMS_KEY }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -no-color

      - name: Terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          set +e
          terraform plan \
            -lock-timeout=5m \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post plan to PR
        if: inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = `environments/${process.env.ENVIRONMENT}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');

            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n\n… truncated …';
            }

            plan = plan.replace(
              /arn:aws:[a-z0-9-]+:[a-z0-9-]*:\d{12}:[^\s"]*/g,
              'arn:aws:…:<redacted>'
            );

            const body = [
              `### Terraform Plan — \`${process.env.ENVIRONMENT}\``,
              ``,
              `Exit code: \`${process.env.PLAN_EXIT}\``,
              ``,
              `<details><summary>Show plan</summary>`,
              ``,
              '```terraform',
              plan,
              '```',
              ``,
              `</details>`,
            ].join('\n');

            const marker = `<!-- tf-plan-${process.env.ENVIRONMENT} -->`;
            const fullBody = marker + '\n' + body;
            const issueNumber = Number(process.env.PR_NUMBER);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: fullBody,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error::terraform plan failed for ${{ matrix.environment }}"
          exit 1
