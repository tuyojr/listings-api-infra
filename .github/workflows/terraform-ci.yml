name: Terraform CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.0"

jobs:
  terraform-checks:
    name: Terraform Lint, Format, Validate, Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337

      - name: Verify tool versions
        run: |
          terraform version
          tflint --version

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init and Validate
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tf_dirs < <(find modules environments -type f -name '*.tf' -not -path '*/examples/*' -printf '%h\n' | sort -u)

          if [ "${#tf_dirs[@]}" -eq 0 ]; then
            echo "No Terraform directories found."
            exit 0
          fi

          for dir in "${tf_dirs[@]}"; do
            echo "Initializing and validating: ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done

      - name: Install TFLint plugins
        run: tflint --init --config="$(pwd)/.tflint.hcl"

      - name: TFLint
        id: tflint
        run: tflint --recursive --config="$(pwd)/.tflint.hcl" --format=compact

      - name: Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895
        with:
          directory: environments
          framework: terraform
          output_format: cli
          output_bc_ids: true
          soft_fail: false
