name: Terraform Pipeline

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply-dev.yml"
      - ".github/workflows/terraform-pipeline.yml"
  push:
    branches: [main, dev]
    paths:
      - "modules/**"
      - "environments/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply-dev.yml"
      - ".github/workflows/terraform-pipeline.yml"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/terraform-ci.yml
    permissions:
      contents: read

  plan:
    name: Plan
    needs: ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/terraform-plan.yml
    with:
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit

  apply-dev:
    name: Apply dev
    needs: plan
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply-dev.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
