name: One-off - import dev count-index resources

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import:
    name: Import dev [1]-index resources
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-one-off-import-dev-${{ github.run_id }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ secrets.TF_STATE_KMS_KEY }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -no-color

      - name: Terraform import
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform import -lock-timeout=5m \
            'module.network.aws_subnet.public[1]' \
            'subnet-0eeb04f9f48a9f5ee'

          terraform import -lock-timeout=5m \
            'module.network.aws_subnet.private[1]' \
            'subnet-02458f62c976d5c21'

          terraform import -lock-timeout=5m \
            'module.network.aws_route_table_association.public[1]' \
            'subnet-0eeb04f9f48a9f5ee/rtb-01a61f41053607047'

          terraform import -lock-timeout=5m \
            'module.network.aws_route_table_association.private[1]' \
            'subnet-02458f62c976d5c21/rtb-06bc72c1f52ca9137'
