name: Terraform Apply (dev)

on:
  push:
    branches: [main, dev]
    paths:
      - "modules/**"
      - "environments/dev/**"
      - ".github/workflows/terraform-apply-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.0"

jobs:
  apply:
    name: Apply dev
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.TF_APPLY_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-dev-${{ github.run_id }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -no-color

      - name: Terraform plan
        working-directory: environments/dev
        env:
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
        run: |
          terraform plan \
            -lock-timeout=5m \
            -no-color \
            -var="acm_certificate_arn=${ACM_CERTIFICATE_ARN}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: environments/dev
        run: terraform apply -lock-timeout=5m -no-color -auto-approve tfplan
